@if (alert) {
  <dialog
    #alertDialog
        class="fixed bottom-4 right-4 top-auto left-auto m-0 w-[calc(100%-2rem)] max-w-md p-0
          rounded-lg border-2 bg-transparent shadow-lg
          pointer-events-none z-50 open:flex open:items-center sm:bottom-10 sm:right-10"
    [style]="alertStyle"
  >
    <div class="flex w-full items-start justify-between gap-3 p-4 text-[var(--main-text)] pointer-events-auto">
      <span class="min-w-0 break-words font-medium">
        {{ alert.message }}
      </span>

      <button
        (click)="close()"
        class="ml-2 font-bold cursor-pointer p-1 hover:bg-black/10 rounded-full leading-none"
        type="button"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-x">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M18 6l-12 12" />
          <path d="M6 6l12 12" />
        </svg>
      </button>
    </div>
  </dialog>
}
