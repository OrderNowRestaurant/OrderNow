<div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:gap-3">
	<label class="text-xl mt-5">Categoría: </label>
	<select
		[value]="filter()"
		(change)="onCategoryChange($event)"
		class="w-full cursor-pointer rounded-lg border border-(--border) bg-(--surface) px-3 py-2 text-(--text-primary) transition-all hover:bg-(--surface-hover) sm:w-auto"
	>
		<option value="">Ningún filtro</option>

		@for (category of this.categoryService.categoryList(); track $index) {
			<option [value]="category.name">{{ category.name }}</option>
		}
	</select>
</div>

<div class="mt-5 grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-4">
    @if (filteredDishes() != null) {
		@if (filteredDishes().length === 0) {
			<p class="col-span-full text-(--text-secondary)">No hay platillos para esta categoría.</p>
		} @else {
			@for (dish of filteredDishes(); track dish.name) {
				<app-dish-card [dish]="dish" (tableDeletedSignal)="onDishDeleted($event)" (editDishSignal)="onDishEdit($event)"></app-dish-card>
			}
		}
	} @else {
		<p class="col-span-full text-(--text-secondary)">No hay platillos para esta categoría.</p>
	}
</div>
