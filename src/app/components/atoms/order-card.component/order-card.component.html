<article class="order-card flex min-h-[17rem] flex-col rounded-xl border border-(--border) bg-(--surface) p-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md sm:p-5">
    <header class="flex items-start justify-between gap-3 border-b border-(--border) pb-4">
        <div>
            <p class="m-0 text-[0.68rem] font-bold uppercase tracking-[0.14em] text-(--text-secondary)">Pedido pendiente</p>
            <h2 class="m-0 mt-1 break-words text-2xl font-extrabold leading-tight text-(--text-primary)">{{ this.order().serviceTableName }}</h2>
        </div>
        <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-(--warning-bg) text-sm font-extrabold text-(--warning)" aria-label="{{ this.order().dishList.length }} platos">
            {{ this.order().dishList.length }}
        </span>
    </header>

    <div class="flex flex-1 flex-col gap-2 py-4">
        @for (dish of this.order().dishList; track $index) {
            <div class="flex items-center justify-between gap-3 rounded-lg bg-(--surface-hover) px-3 py-2.5">
                <span class="min-w-0 break-words text-sm font-semibold text-(--text-primary)">{{ dish.name }}</span>
                <span class="shrink-0 rounded-md bg-(--surface) px-2 py-1 text-sm font-extrabold text-(--primary)">x{{ dish.quantity }}</span>
            </div>
        }
    </div>

    <button (click)="this.removeOrder()" type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-(--primary) px-5 py-3 text-sm font-bold text-white transition-all duration-200 hover:-translate-y-0.5 hover:bg-(--primary-hover) hover:shadow-md focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-(--primary) cursor-pointer">
        Resolver pedido
        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6" /></svg>
    </button>
</article>
